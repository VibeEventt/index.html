<div id="cinematic-intro" class="cinematic-intro">
  <video
    id="intro-video"
    class="intro-video"
    autoplay
    muted
    playsinline
    loop
    preload="auto"
    webkit-playsinline
    aria-hidden="true"
  >
    <source src="./VIBE-HYPE.mp4" type="video/mp4">
  </video>

  <div class="intro-fallback" aria-hidden="true">
    <div class="stage-beam beam-one"></div>
    <div class="stage-beam beam-two"></div>
    <div class="stage-glow"></div>
    <div class="chrome-orbit"></div>
  </div>

  <div class="intro-shade"></div>

  <div class="intro-brand">
    <span class="intro-eyebrow">PRESENTED BY</span>
    <h1 class="chrome-logo">VIBE</h1>
    <span class="intro-subtitle">EVENT COLLECTIVE</span>
  </div>

  <div class="intro-flash"></div>
</div>

<style>
.cinematic-intro {
  position: fixed;
  inset: 0;
  z-index: 99999;
  overflow: hidden;
  isolation: isolate;
  background: #030108;
  animation: intro-exit 1s ease 5.5s forwards;
}

.intro-video,
.intro-fallback,
.intro-shade {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.intro-video {
  z-index: 0;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1s ease;
}

.cinematic-intro.video-ready .intro-video {
  opacity: 1;
}

.intro-fallback {
  z-index: -1;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 75%, #6e0c7b 0%, transparent 36%),
    radial-gradient(ellipse at 15% 25%, #122c8c 0%, transparent 40%),
    radial-gradient(ellipse at 85% 20%, #a20a5d 0%, transparent 35%),
    #030108;
}

.stage-glow {
  position: absolute;
  width: 75vw;
  height: 75vw;
  max-width: 850px;
  max-height: 850px;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle,
    #ff2bc844 0%,
    #7428ff30 35%,
    transparent 70%
  );
  filter: blur(22px);
  animation: glow-pulse 2.5s ease-in-out infinite alternate;
}

.stage-beam {
  position: absolute;
  width: 18vw;
  height: 150%;
  top: -25%;
  filter: blur(16px);
  opacity: .7;
  transform-origin: top center;
  mix-blend-mode: screen;
}

.beam-one {
  left: 22%;
  background: linear-gradient(180deg, #30d9ff99, transparent 75%);
  transform: rotate(28deg);
  animation: beam-sweep 4s ease-in-out infinite alternate;
}

.beam-two {
  right: 22%;
  background: linear-gradient(180deg, #ff2bc899, transparent 75%);
  transform: rotate(-28deg);
  animation: beam-sweep 3s ease-in-out infinite alternate-reverse;
}

.chrome-orbit {
  position: absolute;
  width: min(72vw, 650px);
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  border: 2px solid transparent;
  border-radius: 50%;
  background:
    linear-gradient(#09030e, #09030e) padding-box,
    linear-gradient(110deg, #ffffff, #ff37d5, #5ceaff, #ffffff) border-box;
  box-shadow:
    0 0 28px #ff38d555,
    inset 0 0 35px #4a3aff33;
  transform: translate(-50%, -50%) rotateX(68deg);
  animation: orbit-spin 9s linear infinite;
}

.intro-shade {
  z-index: 1;
  background: linear-gradient(
    180deg,
    #02000666,
    #02000622 40%,
    #020006bb
  );
}

.intro-brand {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  width: 100%;
  padding: 24px;
  text-align: center;
  transform: translate(-50%, -50%);
  animation: brand-arrive 1.4s cubic-bezier(.16,1,.3,1) both;
}

.intro-eyebrow,
.intro-subtitle {
  display: block;
  color: #fff;
  font: 600 11px/1.5 Arial, sans-serif;
  letter-spacing: .55em;
}

.chrome-logo {
  margin: 8px 0;
  font: 900 clamp(90px, 23vw, 240px)/.9 Arial, sans-serif;
  letter-spacing: -.09em;
  color: #dfe4f2;
  background: linear-gradient(
    180deg,
    #fff 0%,
    #aeb8cb 18%,
    #fff 30%,
    #555d72 48%,
    #f7f8ff 63%,
    #858da5 78%,
    #fff 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px #f52dff66)
          drop-shadow(0 0 35px #2a8dff66);
}

.intro-flash {
  position: absolute;
  z-index: 5;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  animation: flash-hit .8s ease 3.7s both;
}

@keyframes glow-pulse {
  to { transform: translate(-50%, -50%) scale(1.18); opacity: .7; }
}

@keyframes beam-sweep {
  to { opacity: .95; filter: blur(8px); }
}

@keyframes orbit-spin {
  to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(360deg); }
}

@keyframes brand-arrive {
  from { opacity: 0; transform: translate(-50%, -42%) scale(.8); filter: blur(14px); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
}

@keyframes flash-hit {
  0%, 55%, 100% { opacity: 0; }
  60% { opacity: .95; }
  68% { opacity: .12; }
}

@keyframes intro-exit {
  to { opacity: 0; visibility: hidden; pointer-events: none; }
}

@media (prefers-reduced-motion: reduce) {
  .cinematic-intro { animation-duration: .3s; animation-delay: 2s; }
  .intro-flash { animation: none; }
  .chrome-orbit, .stage-glow, .stage-beam { animation: none; }
}

@media (max-width: 600px) {
  .intro-eyebrow, .intro-subtitle { letter-spacing: .3em; }
  .chrome-orbit { width: 95vw; }
}
</style>

<script>
(() => {
  const intro = document.getElementById("cinematic-intro");
  const video = document.getElementById("intro-video");

  if (!intro || !video) return;

  const markReady = () => {
    if (video.videoWidth > 0) {
      intro.classList.add("video-ready");
    }
  };

  video.addEventListener("loadeddata", markReady);
  video.addEventListener("playing", markReady);
  video.addEventListener("error", () => {
    intro.classList.remove("video-ready");
    console.error("VIBE-HYPE.mp4 yüklenemedi:", video.error);
  });

  video.play().then(markReady).catch(() => {
    // Video oynatılamazsa neon sahne arka planı görünür kalır.
  });

  window.addEventListener("pageshow", () => {
    video.play().catch(() => {});
  });
})();
</script>
