<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJ TINA - VIBE EVENT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  cursor:default;
}

/* =========================================================
   MAIN STAGE
========================================================= */

.stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 50%,
      #18002f 0%,
      #090014 35%,
      #020006 70%,
      #000 100%
    );
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* =========================================================
   ATMOSPHERE
========================================================= */

.atmosphere{
  position:absolute;
  inset:-20%;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(255,0,180,.18),
      transparent 28%
    ),
    radial-gradient(
      ellipse at 20% 50%,
      rgba(0,180,255,.14),
      transparent 28%
    ),
    radial-gradient(
      ellipse at 80% 50%,
      rgba(130,0,255,.15),
      transparent 28%
    );

  animation:
    atmosphereMove 6s ease-in-out infinite alternate,
    atmospherePulse 2.2s ease-in-out infinite;
}

@keyframes atmosphereMove{
  0%{
    transform:translate(-3%,-2%) scale(1);
  }

  50%{
    transform:translate(2%,2%) scale(1.08);
  }

  100%{
    transform:translate(-2%,1%) scale(1.15);
  }
}

@keyframes atmospherePulse{
  0%,100%{
    opacity:.65;
  }

  50%{
    opacity:1;
  }
}

/* =========================================================
   NEON PORTALS
========================================================= */

.portal{
  position:absolute;

  width:62vw;
  height:62vw;

  max-width:1000px;
  max-height:1000px;

  min-width:420px;
  min-height:420px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    perspective(800px)
    rotateX(68deg)
    rotateZ(0deg);

  border-radius:50%;

  border:
    3px solid rgba(255,0,220,.8);

  box-shadow:
    0 0 12px #ff00d9,
    0 0 35px #ff00d9,
    0 0 90px rgba(255,0,200,.7),
    inset 0 0 25px rgba(255,0,200,.8);

  opacity:.75;

  animation:
    portalSpin 7s linear infinite,
    portalPulse 1.6s ease-in-out infinite;
}

.portal::before,
.portal::after{
  content:"";
  position:absolute;
  inset:7%;

  border-radius:50%;

  border:
    2px solid rgba(0,210,255,.8);

  box-shadow:
    0 0 15px #00d9ff,
    0 0 45px rgba(0,220,255,.7),
    inset 0 0 20px rgba(0,220,255,.8);
}

.portal::after{
  inset:15%;

  border-color:rgba(170,0,255,.9);

  box-shadow:
    0 0 15px #a000ff,
    0 0 55px rgba(150,0,255,.8),
    inset 0 0 20px rgba(170,0,255,.8);
}

.portal2{
  position:absolute;

  width:43vw;
  height:43vw;

  min-width:300px;
  min-height:300px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    perspective(900px)
    rotateX(72deg);

  border-radius:50%;

  border:
    2px solid rgba(0,230,255,.75);

  box-shadow:
    0 0 20px #00eaff,
    0 0 65px rgba(0,200,255,.7),
    inset 0 0 25px rgba(0,220,255,.7);

  animation:
    portalSpinReverse 4.5s linear infinite,
    portalPulse 1.2s ease-in-out infinite;
}

/* =========================================================
   SIDE GLOW
========================================================= */

.sideGlow{
  position:absolute;
  top:-20%;
  width:25vw;
  height:140%;

  filter:blur(35px);

  opacity:.6;

  pointer-events:none;

  animation:sideMove 3s ease-in-out infinite alternate;
}

.sideGlow.left{
  left:-12%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,0,190,.55),
      rgba(160,0,255,.25),
      transparent
    );

  transform:rotate(10deg);
}

.sideGlow.right{
  right:-12%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,200,255,.5),
      rgba(50,80,255,.3),
      transparent
    );

  transform:rotate(-10deg);

  animation-delay:-1.4s;
}

@keyframes sideMove{
  from{
    transform:translateX(-4%) rotate(10deg);
  }

  to{
    transform:translateX(9%) rotate(16deg);
  }
}

/* =========================================================
   CENTER ENERGY
========================================================= */

.centerEnergy{
  position:absolute;

  left:50%;
  top:50%;

  width:35vw;
  height:35vw;

  min-width:280px;
  min-height:280px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.16) 0%,
      rgba(255,0,210,.12) 12%,
      rgba(0,200,255,.07) 30%,
      transparent 65%
    );

  filter:blur(5px);

  animation:
    centerPulse 1.2s ease-in-out infinite,
    centerRotate 10s linear infinite;

  pointer-events:none;
}

@keyframes centerPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(.85);
    opacity:.55;
  }

  50%{
    transform:translate(-50%,-50%) scale(1.2);
    opacity:1;
  }
}

@keyframes centerRotate{
  to{
    rotate:360deg;
  }
}

/* =========================================================
   TEXT
========================================================= */

.brand{
  position:absolute;

  top:7%;

  left:50%;
  transform:translateX(-50%);

  color:#fff;

  font-size:clamp(14px,1.3vw,24px);

  font-weight:700;

  letter-spacing:
    clamp(6px,1vw,16px);

  text-transform:uppercase;

  text-shadow:
    0 0 5px #fff,
    0 0 15px #ff00d9,
    0 0 35px #ff00d9;

  opacity:.9;

  z-index:20;
}

.title{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(1);

  color:white;

  font-size:
    clamp(75px,13vw,250px);

  font-weight:1000;

  letter-spacing:
    clamp(-5px,-.5vw,-2px);

  line-height:.8;

  white-space:nowrap;

  text-align:center;

  z-index:25;

  text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px #ff00de,
    0 0 50px #ff00de,
    0 0 90px #9b00ff,
    0 0 150px rgba(0,150,255,.8);

  animation:
    titlePulse 1.15s ease-in-out infinite,
    titleGlow 2.2s ease-in-out infinite alternate;
}

@keyframes titlePulse{
  0%,100%{
    transform:
      translate(-50%,-50%)
      scale(.96);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.035);
  }
}

@keyframes titleGlow{
  0%{
    filter:
      brightness(.9)
      saturate(1);
  }

  100%{
    filter:
      brightness(1.4)
      saturate(1.6);
  }
}

.subtitle{
  position:absolute;

  left:50%;
  top:63%;

  transform:translateX(-50%);

  color:#fff;

  font-size:
    clamp(13px,1.5vw,26px);

  font-weight:800;

  letter-spacing:
    clamp(5px,1vw,13px);

  white-space:nowrap;

  text-shadow:
    0 0 5px #fff,
    0 0 15px #00eaff,
    0 0 35px #008cff;

  z-index:25;

  animation:
    subtitlePulse 1.5s ease-in-out infinite;
}

@keyframes subtitlePulse{
  0%,100%{
    opacity:.65;
  }

  50%{
    opacity:1;
  }
}

/* =========================================================
   RGB GLITCH
========================================================= */

.rgb{
  position:absolute;

  left:50%;
  top:50%;

  width:100%;
  height:30%;

  transform:translate(-50%,-50%);

  pointer-events:none;

  z-index:23;

  opacity:.25;

  mix-blend-mode:screen;

  animation:rgbShift 1.8s steps(2,end) infinite;
}

.rgb::before,
.rgb::after{
  content:"DJ TINA";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-size:
    clamp(75px,13vw,250px);

  font-weight:1000;

  line-height:.8;

  white-space:nowrap;
}

.rgb::before{
  color:#00ffff;
  transform:
    translate(calc(-50% - 6px),-50%);
}

.rgb::after{
  color:#ff0066;
  transform:
    translate(calc(-50% + 6px),-50%);
}

@keyframes rgbShift{
  0%,90%,100%{
    opacity:0;
  }

  92%{
    opacity:.5;
  }

  94%{
    opacity:0;
  }

  96%{
    opacity:.35;
  }
}

/* =========================================================
   FLASH
========================================================= */

.flash{
  position:absolute;
  inset:0;

  background:#fff;

  opacity:0;

  pointer-events:none;

  z-index:100;
}

.flash.active{
  animation:flashBoom .65s ease-out;
}

@keyframes flashBoom{
  0%{
    opacity:1;
  }

  8%{
    opacity:.15;
  }

  16%{
    opacity:.95;
  }

  25%{
    opacity:.05;
  }

  38%{
    opacity:.7;
  }

  100%{
    opacity:0;
  }
}

/* =========================================================
   SCREEN SHOCK
========================================================= */

.shockwave{
  position:absolute;

  left:50%;
  top:50%;

  width:30px;
  height:30px;

  transform:
    translate(-50%,-50%)
    scale(1);

  border-radius:50%;

  border:5px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 20px #fff,
    0 0 60px #ff00d9,
    0 0 120px #00d9ff;

  opacity:0;

  pointer-events:none;

  z-index:90;
}

.shockwave.active{
  animation:shock 1.1s cubic-bezier(.1,.7,.1,1);
}

@keyframes shock{
  0%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(.05);
  }

  50%{
    opacity:.7;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(45);
  }
}

/* =========================================================
   VIGNETTE
========================================================= */

.vignette{
  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:70;

  background:
    radial-gradient(
      ellipse at center,
      transparent 35%,
      rgba(0,0,0,.2) 62%,
      rgba(0,0,0,.75) 100%
    );
}

/* =========================================================
   GRAIN
========================================================= */

.grain{
  position:absolute;
  inset:-50%;

  pointer-events:none;

  z-index:75;

  opacity:.09;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");

  animation:grainMove .18s steps(2) infinite;
}

@keyframes grainMove{
  0%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(2%,-3%);
  }

  50%{
    transform:translate(-3%,2%);
  }

  75%{
    transform:translate(3%,3%);
  }

  100%{
    transform:translate(-2%,-2%);
  }
}

/* =========================================================
   INTRO
========================================================= */

.intro{
  position:absolute;

  inset:0;

  z-index:200;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  gap:25px;

  background:
    radial-gradient(
      circle at center,
      rgba(25,0,45,.98),
      rgba(0,0,0,.99) 70%
    );

  transition:
    opacity .8s ease,
    visibility .8s ease;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
}

.introBrand{
  color:#fff;

  font-size:
    clamp(14px,1.4vw,25px);

  letter-spacing:
    clamp(7px,1.2vw,18px);

  text-shadow:
    0 0 8px #fff,
    0 0 25px #ff00d9,
    0 0 55px #ff00d9;

  animation:introBrand 2s ease-in-out infinite alternate;
}

@keyframes introBrand{
  from{
    opacity:.65;
  }

  to{
    opacity:1;
  }
}

.introTitle{
  color:#fff;

  font-size:
    clamp(70px,14vw,260px);

  line-height:.8;

  font-weight:1000;

  letter-spacing:-5px;

  text-shadow:
    0 0 8px #fff,
    0 0 20px #ff00dc,
    0 0 45px #ff00dc,
    0 0 100px #8700ff,
    0 0 180px #00c8ff;

  animation:
    introTitlePulse 1.4s ease-in-out infinite;
}

@keyframes introTitlePulse{
  0%,100%{
    transform:scale(.96);
    filter:brightness(.9);
  }

  50%{
    transform:scale(1.04);
    filter:brightness(1.4);
  }
}

.readyButton{
  position:relative;

  margin-top:30px;

  padding:
    18px 38px;

  border:
    1px solid rgba(255,255,255,.8);

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      rgba(255,0,190,.18),
      rgba(0,190,255,.18)
    );

  color:#fff;

  font-size:
    clamp(14px,1.4vw,22px);

  font-weight:900;

  letter-spacing:
    4px;

  cursor:pointer;

  overflow:hidden;

  box-shadow:
    0 0 10px rgba(255,0,210,.8),
    0 0 35px rgba(0,200,255,.5),
    inset 0 0 20px rgba(255,255,255,.08);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.readyButton::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 20%,
      rgba(255,255,255,.7) 50%,
      transparent 80%
    );

  transform:translateX(-120%);

  animation:
    buttonShine 2.2s infinite;
}

@keyframes buttonShine{
  0%,55%{
    transform:translateX(-120%);
  }

  75%,100%{
    transform:translateX(120%);
  }
}

.readyButton:hover{
  transform:scale(1.08);

  box-shadow:
    0 0 20px #ff00d9,
    0 0 60px #ff00d9,
    0 0 100px #00cfff,
    inset 0 0 30px rgba(255,255,255,.15);
}

/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{
  position:absolute;

  inset:0;

  z-index:190;

  display:flex;

  align-items:center;

  justify-content:center;

  pointer-events:none;

  opacity:0;

  visibility:hidden;
}

.countdown.show{
  opacity:1;
  visibility:visible;
}

.countNumber{
  color:#fff;

  font-size:
    clamp(180px,32vw,620px);

  line-height:.8;

  font-weight:1000;

  text-shadow:
    0 0 10px #fff,
    0 0 30px #ff00dd,
    0 0 70px #ff00dd,
    0 0 130px #8c00ff,
    0 0 220px #00d9ff;

  transform:scale(.5);

  opacity:0;
}

.countNumber.pop{
  animation:
    countPop .8s cubic-bezier(.12,.8,.15,1);
}

@keyframes countPop{
  0%{
    opacity:0;
    transform:scale(.25) rotate(-4deg);
    filter:brightness(3);
  }

  18%{
    opacity:1;
  }

  45%{
    transform:scale(1.12) rotate(1deg);
    filter:brightness(1.8);
  }

  100%{
    opacity:0;
    transform:scale(1.45);
    filter:brightness(1);
  }
}

/* =========================================================
   BOOM
========================================================= */

.boom{
  position:absolute;

  inset:0;

  z-index:210;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#fff;

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}

.boom.show{
  visibility:visible;
  animation:finalBoom 1.25s ease-out forwards;
}

.boomText{
  color:#000;

  font-size:
    clamp(65px,14vw,260px);

  font-weight:1000;

  letter-spacing:-5px;

  opacity:0;

  transform:scale(.3);

  text-shadow:
    0 0 5px #fff;
}

.boom.show .boomText{
  animation:boomText .9s ease-out .12s forwards;
}

@keyframes finalBoom{
  0%{
    opacity:1;
  }

  18%{
    opacity:.85;
  }

  25%{
    opacity:.05;
  }

  34%{
    opacity:1;
  }

  43%{
    opacity:.15;
  }

  100%{
    opacity:0;
  }
}

@keyframes boomText{
  0%{
    opacity:0;
    transform:scale(.2);
  }

  35%{
    opacity:1;
    transform:scale(1.1);
  }

  100%{
    opacity:0;
    transform:scale(1.5);
  }
}

/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen{
  position:absolute;

  right:20px;
  bottom:20px;

  z-index:300;

  padding:10px 14px;

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:10px;

  color:#fff;

  background:
    rgba(0,0,0,.25);

  backdrop-filter:blur(10px);

  cursor:pointer;

  font-size:12px;

  opacity:.55;

  transition:.2s ease;
}

.fullscreen:hover{
  opacity:1;

  border-color:#ff00d9;

  box-shadow:
    0 0 20px rgba(255,0,220,.5);
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes portalSpin{
  to{
    transform:
      translate(-50%,-50%)
      perspective(800px)
      rotateX(68deg)
      rotateZ(360deg);
  }
}

@keyframes portalSpinReverse{
  to{
    transform:
      translate(-50%,-50%)
      perspective(900px)
      rotateX(72deg)
      rotateZ(-360deg);
  }
}

@keyframes portalPulse{
  0%,100%{
    opacity:.55;
    filter:brightness(.8);
  }

  50%{
    opacity:1;
    filter:brightness(1.7);
  }
}

/* =========================================================
   MOBILE / SMALL SCREEN
========================================================= */

@media(max-width:700px){

  .title{
    font-size:20vw;
  }

  .subtitle{
    top:62%;
    letter-spacing:4px;
  }

  .portal{
    width:100vw;
    height:100vw;
  }

  .portal2{
    width:75vw;
    height:75vw;
  }

  .brand{
    top:5%;
  }

  .readyButton{
    padding:16px 28px;
  }
}

</style>
</head>

<body>

<div class="stage">

  <canvas id="visual"></canvas>

  <div class="atmosphere"></div>

  <div class="sideGlow left"></div>
  <div class="sideGlow right"></div>

  <div class="portal"></div>
  <div class="portal2"></div>

  <div class="centerEnergy"></div>

  <div class="brand">
    VIBE EVENT
  </div>

  <div class="title">
    DJ TINA
  </div>

  <div class="subtitle">
    OPEN YOUR EYES
  </div>

  <div class="rgb"></div>

  <div class="flash" id="flash"></div>

  <div class="shockwave" id="shockwave"></div>

  <div class="vignette"></div>
  <div class="grain"></div>


  <!-- INTRO -->

  <div class="intro" id="intro">

    <div class="introBrand">
      VIBE EVENT
    </div>

    <div class="introTitle">
      DJ TINA
    </div>

    <button
      class="readyButton"
      id="readyButton"
    >
      ARE YOU READY?
    </button>

  </div>


  <!-- COUNTDOWN -->

  <div
    class="countdown"
    id="countdown"
  >
    <div
      class="countNumber"
      id="countNumber"
    >
      10
    </div>
  </div>


  <!-- FINAL BOOM -->

  <div
    class="boom"
    id="boom"
  >
    <div class="boomText">
      DJ TINA
    </div>
  </div>


  <!-- FULLSCREEN -->

  <button
    class="fullscreen"
    id="fullscreen"
  >
    ⛶ FULLSCREEN
  </button>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("visual");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

let dpr =
  Math.min(window.devicePixelRatio || 1, 2);

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   PARTICLES
========================================================= */

const particles = [];

const PARTICLE_COUNT = 260;

for(let i=0;i<PARTICLE_COUNT;i++){

  particles.push({

    x:Math.random(),
    y:Math.random(),

    z:Math.random(),

    speed:
      .0004 +
      Math.random() * .002,

    size:
      .4 +
      Math.random() * 2.8,

    alpha:
      .2 +
      Math.random() * .8,

    hue:
      Math.random() > .5
        ? "pink"
        : "blue"

  });

}


/* =========================================================
   LASERS
========================================================= */

const lasers = [];

for(let i=0;i<18;i++){

  lasers.push({

    side:
      Math.random() > .5
        ? -1
        : 1,

    angle:
      Math.random() * Math.PI * 2,

    speed:
      (.004 + Math.random()*.012) *
      (Math.random()>.5 ? 1 : -1),

    width:
      1 + Math.random()*3,

    alpha:
      .25 + Math.random()*.6,

    color:
      Math.random() > .5
        ? "cyan"
        : "pink"

  });

}


/* =========================================================
   BEAMS
========================================================= */

const beams = [];

for(let i=0;i<14;i++){

  beams.push({

    angle:
      Math.random()*Math.PI*2,

    speed:
      .001 +
      Math.random()*.004,

    width:
      .02 +
      Math.random()*.05,

    alpha:
      .05 +
      Math.random()*.15,

    color:
      i%2===0
        ? "pink"
        : "blue"

  });

}


/* =========================================================
   GLOBAL EFFECT STATE
========================================================= */

let energy = 1;

let pulse = 0;

let shake = 0;

let rotation = 0;

let burstParticles = [];

let lastTime = performance.now();


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

  const gradient =
    ctx.createRadialGradient(
      W*.5,
      H*.5,
      0,
      W*.5,
      H*.5,
      Math.max(W,H)*.75
    );

  gradient.addColorStop(
    0,
    `rgba(38,0,70,${.55 + pulse*.15})`
  );

  gradient.addColorStop(
    .35,
    "rgba(11,0,32,.75)"
  );

  gradient.addColorStop(
    1,
    "#000"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* =========================================================
   DRAW ROTATING LIGHT BEAMS
========================================================= */

function drawBeams(t){

  ctx.save();

  ctx.translate(
    W/2,
    H/2
  );

  ctx.globalCompositeOperation =
    "screen";

  for(const beam of beams){

    beam.angle +=
      beam.speed *
      (1 + energy*.4);

    const length =
      Math.max(W,H)*1.2;

    const spread =
      beam.width *
      (1 + pulse*.8);

    const x1 =
      Math.cos(beam.angle) *
      20;

    const y1 =
      Math.sin(beam.angle) *
      20;

    const x2 =
      Math.cos(beam.angle-spread) *
      length;

    const y2 =
      Math.sin(beam.angle-spread) *
      length;

    const x3 =
      Math.cos(beam.angle+spread) *
      length;

    const y3 =
      Math.sin(beam.angle+spread) *
      length;

    const color =
      beam.color === "pink"
        ? `rgba(255,0,210,${beam.alpha*(.5+pulse*.5)})`
        : `rgba(0,210,255,${beam.alpha*(.5+pulse*.5)})`;

    const grd =
      ctx.createLinearGradient(
        x1,
        y1,
        x2,
        y2
      );

    grd.addColorStop(
      0,
      color
    );

    grd.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle = grd;

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.lineTo(
      x3,
      y3
    );

    ctx.closePath();

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   DRAW LASER FANS
========================================================= */

function drawLasers(t){

  ctx.save();

  ctx.translate(
    W/2,
    H/2
  );

  ctx.globalCompositeOperation =
    "screen";

  for(const laser of lasers){

    laser.angle +=
      laser.speed *
      (1 + energy);

    const startX =
      laser.side *
      W*.12;

    const startY =
      H*.08;

    const length =
      Math.max(W,H)*1.3;

    const angle =
      laser.angle +
      (laser.side > 0 ? Math.PI : 0);

    const endX =
      startX +
      Math.cos(angle)*length;

    const endY =
      startY +
      Math.sin(angle)*length;

    const grad =
      ctx.createLinearGradient(
        startX,
        startY,
        endX,
        endY
      );

    if(laser.color==="pink"){

      grad.addColorStop(
        0,
        `rgba(255,0,220,${laser.alpha})`
      );

      grad.addColorStop(
        .35,
        `rgba(255,0,220,${laser.alpha*.4})`
      );

    }else{

      grad.addColorStop(
        0,
        `rgba(0,230,255,${laser.alpha})`
      );

      grad.addColorStop(
        .35,
        `rgba(0,230,255,${laser.alpha*.4})`
      );

    }

    grad.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.strokeStyle = grad;

    ctx.lineWidth =
      laser.width *
      (1 + pulse*2);

    ctx.beginPath();

    ctx.moveTo(
      startX,
      startY
    );

    ctx.lineTo(
      endX,
      endY
    );

    ctx.stroke();

    /* laser glow */

    ctx.lineWidth =
      laser.width * 5;

    ctx.globalAlpha = .08;

    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

  ctx.save();

  ctx.globalCompositeOperation =
    "screen";

  for(const p of particles){

    p.z -=
      p.speed *
      (1 + energy*.8);

    if(p.z <= 0){

      p.z = 1;

      p.x =
        Math.random();

      p.y =
        Math.random();

    }

    const dx =
      p.x - .5;

    const dy =
      p.y - .5;

    const depth =
      1 - p.z;

    const spread =
      1 + depth*4;

    const x =
      W*.5 +
      dx*W*spread;

    const y =
      H*.5 +
      dy*H*spread;

    const size =
      p.size *
      (1 + depth*3);

    const alpha =
      p.alpha *
      depth *
      (.3 + energy*.7);

    if(
      x < -50 ||
      x > W+50 ||
      y < -50 ||
      y > H+50
    ){
      continue;
    }

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI*2
    );

    if(p.hue==="pink"){

      ctx.fillStyle =
        `rgba(255,40,220,${alpha})`;

      ctx.shadowColor =
        "#ff00d9";

    }else{

      ctx.fillStyle =
        `rgba(30,220,255,${alpha})`;

      ctx.shadowColor =
        "#00d9ff";
    }

    ctx.shadowBlur =
      10 + depth*20;

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   BURST PARTICLES
========================================================= */

function drawBurstParticles(){

  ctx.save();

  ctx.globalCompositeOperation =
    "screen";

  for(let i=burstParticles.length-1;i>=0;i--){

    const p =
      burstParticles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vx *= .985;
    p.vy *= .985;

    p.life -= .018;

    if(p.life <= 0){

      burstParticles.splice(i,1);

      continue;
    }

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      `rgba(255,255,255,${p.life})`;

    ctx.shadowColor =
      p.color;

    ctx.shadowBlur =
      20;

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   CREATE BURST
========================================================= */

function createBurst(
  amount = 100
){

  for(let i=0;i<amount;i++){

    const a =
      Math.random() *
      Math.PI * 2;

    const speed =
      2 +
      Math.random()*15;

    burstParticles.push({

      x:W/2,
      y:H/2,

      vx:
        Math.cos(a)*speed,

      vy:
        Math.sin(a)*speed,

      life:
        .5 +
        Math.random()*.7,

      size:
        1 +
        Math.random()*5,

      color:
        Math.random()>.5
          ? "#ff00d9"
          : "#00eaff"

    });
  }
}


/* =========================================================
   ENERGY RINGS
========================================================= */

function drawEnergyRings(t){

  ctx.save();

  ctx.translate(
    W/2,
    H/2
  );

  ctx.globalCompositeOperation =
    "screen";

  for(let i=0;i<9;i++){

    const radius =
      80 +
      i*70 +
      Math.sin(
        t*.002 +
        i
      )*18;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius *
      (1 + pulse*.25),
      0,
      Math.PI*2
    );

    const alpha =
      .03 +
      pulse*.05;

    if(i%2===0){

      ctx.strokeStyle =
        `rgba(255,0,210,${alpha})`;

    }else{

      ctx.strokeStyle =
        `rgba(0,220,255,${alpha})`;
    }

    ctx.lineWidth =
      1 +
      pulse*3;

    ctx.stroke();
  }

  ctx.restore();
}


/* =========================================================
   RANDOM FLASH
========================================================= */

let nextFlash =
  performance.now() +
  1200 +
  Math.random()*2500;

function randomFlash(t){

  if(t < nextFlash){
    return;
  }

  nextFlash =
    t +
    1000 +
    Math.random()*3000;

  if(Math.random() < .75){

    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");

    createBurst(
      35 +
      Math.floor(
        Math.random()*50
      )
    );

    pulse = 1;
  }
}


/* =========================================================
   MAIN ANIMATION
========================================================= */

function animate(t){

  const dt =
    Math.min(
      40,
      t-lastTime
    );

  lastTime = t;

  pulse *= .94;

  energy =
    .8 +
    Math.sin(t*.0022)*.2 +
    pulse*.8;

  rotation +=
    .0015 *
    energy;

  let shakeX = 0;
  let shakeY = 0;

  if(shake > .1){

    shake *= .9;

    shakeX =
      (Math.random()-.5) *
      shake;

    shakeY =
      (Math.random()-.5) *
      shake;
  }

  ctx.save();

  ctx.translate(
    shakeX,
    shakeY
  );

  drawBackground();

  drawBeams(t);

  drawLasers(t);

  drawEnergyRings(t);

  drawParticles();

  drawBurstParticles();

  ctx.restore();

  randomFlash(t);

  requestAnimationFrame(
    animate
  );
}

requestAnimationFrame(
  animate
);


/* =========================================================
   DOM
========================================================= */

const intro =
  document.getElementById("intro");

const readyButton =
  document.getElementById("readyButton");

const countdown =
  document.getElementById("countdown");

const countNumber =
  document.getElementById("countNumber");

const boom =
  document.getElementById("boom");

const flash =
  document.getElementById("flash");

const shockwave =
  document.getElementById("shockwave");

const fullscreen =
  document.getElementById("fullscreen");


/* =========================================================
   FLASH FUNCTION
========================================================= */

function triggerFlash(){

  flash.classList.remove(
    "active"
  );

  void flash.offsetWidth;

  flash.classList.add(
    "active"
  );
}


/* =========================================================
   SHOCKWAVE
========================================================= */

function triggerShockwave(){

  shockwave.classList.remove(
    "active"
  );

  void shockwave.offsetWidth;

  shockwave.classList.add(
    "active"
  );
}


/* =========================================================
   COUNTDOWN
========================================================= */

let countdownRunning = false;

async function runCountdown(){

  countdownRunning = true;

  countdown.classList.add(
    "show"
  );

  for(
    let number = 10;
    number >= 1;
    number--
  ){

    countNumber.textContent =
      number;

    countNumber.classList.remove(
      "pop"
    );

    void countNumber.offsetWidth;

    countNumber.classList.add(
      "pop"
    );

    /* Her sayıda kısa flash */

    triggerFlash();

    /* Her sayıda kamera sarsıntısı */

    shake =
      number <= 3
        ? 18
        : 8;

    /* Son üç sayıda parçacık patlaması */

    if(number <= 3){

      createBurst(
        80
      );
    }

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          900
        )
    );
  }

  countdown.classList.remove(
    "show"
  );

  /* =====================================================
     FINAL EXPLOSION
  ===================================================== */

  createBurst(
    500
  );

  pulse = 5;

  shake = 45;

  triggerShockwave();

  triggerFlash();

  boom.classList.add(
    "show"
  );

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        1250
      )
  );

  boom.classList.remove(
    "show"
  );

  /* Birkaç ekstra patlama */

  setTimeout(
    ()=>{
      triggerFlash();
      createBurst(180);
      pulse=3;
    },
    100
  );

  setTimeout(
    ()=>{
      triggerFlash();
      createBurst(120);
      pulse=2;
    },
    320
  );

  countdownRunning = false;
}


/* =========================================================
   START SHOW
========================================================= */

readyButton.addEventListener(
  "click",
  async ()=>{

    if(countdownRunning){
      return;
    }

    /* Button click → fullscreen */

    goFullscreen();

    /* Intro kayboluyor */

    intro.classList.add(
      "hide"
    );

    /* İlk büyük flash */

    setTimeout(
      ()=>{
        triggerFlash();
        createBurst(80);
        pulse=2;
      },
      300
    );

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          700
        )
    );

    runCountdown();
  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

function goFullscreen(){

  const el =
    document.documentElement;

  if(
    !document.fullscreenElement
  ){

    if(
      el.requestFullscreen
    ){

      el.requestFullscreen()
        .catch(
          ()=>{}
        );
    }
  }
}

fullscreen.addEventListener(
  "click",
  goFullscreen
);


/* =========================================================
   DOUBLE CLICK
========================================================= */

document.addEventListener(
  "dblclick",
  ()=>{
    goFullscreen();
  }
);


/* =========================================================
   MOUSE PARALLAX
========================================================= */

document.addEventListener(
  "mousemove",
  e=>{

    const x =
      (e.clientX/W-.5);

    const y =
      (e.clientY/H-.5);

    const title =
      document.querySelector(
        ".title"
      );

    if(title){

      title.style.marginLeft =
        `${x*18}px`;

      title.style.marginTop =
        `${y*10}px`;
    }
  }
);


/* =========================================================
   SPACE = FLASH
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space"){

      e.preventDefault();

      triggerFlash();

      createBurst(
        120
      );

      pulse=3;

      shake=25;
    }

    if(e.code==="Enter"){

      if(!countdownRunning){

        readyButton.click();
      }
    }
  }
);

</script>
